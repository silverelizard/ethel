[package]
name = "ethel"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = { version = "=0.5.1", features = ["json"] }
serde = "1.0.167"
diesel = { version = "2.1.0", features = ["postgres", "r2d2"] }
dotenvy = "0.15"
rocket_sync_db_pools = { version = "0.1.0", features = ["diesel_postgres_pool"] }
