services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ethel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-etheldb}
    volumes:
      - db-data:/var/lib/postgresql/data
    # No published ports: the app reaches the db over the compose network.
    # For host access during development, use docker-compose.dev.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ethel}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-etheldb}
      ETHEL_PASSWORD: ${ETHEL_PASSWORD:?Set ETHEL_PASSWORD in .env (see .env.example)}
      ROCKET_SECRET_KEY: ${ROCKET_SECRET_KEY:?Set ROCKET_SECRET_KEY in .env (see .env.example)}
      ETHEL_SECURE_COOKIE: ${ETHEL_SECURE_COOKIE:-false}
    ports:
      - "8000:8000"

volumes:
  db-data:
