services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethel
      POSTGRES_PASSWORD: ethel
      POSTGRES_DB: etheldb
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ROCKET_DATABASES: '{my_db={url="postgres://ethel:ethel@db:5432/etheldb"}}'
    ports:
      - "8000:8000"

volumes:
  db-data:
